name: build

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install

      - name: Install dependencies
        run: uv sync --locked --all-extras --dev

      - name: Run unit tests
        run: make test

      - name: Check Schema Changes
        run: |
          make generate_out

          if [ -n "$(git status --porcelain --untracked-files=all -- schemas)" ]; then
            git status --short -- schemas
            git add --intent-to-add -- schemas
            git diff -- schemas
            echo "::error::Generated schema is out of date. Run 'make generate_out' and commit the changes."
            exit 1
          fi

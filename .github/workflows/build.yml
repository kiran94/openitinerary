name: build

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install

      - name: Install dependencies
        run: uv sync --locked --all-extras --dev

      - name: Run unit tests
        run: make test

      - name: Check Schema Changes
        run: |
          make generate_out

          if [ -n "$(git status --porcelain --untracked-files=all -- schemas)" ]; then
            git status --short -- schemas
            git add --intent-to-add -- schemas
            git diff -- schemas
            echo "::error::Generated schema is out of date. Run 'make generate_out' and commit the changes."
            exit 1
          fi

      - name: Build distributions
        run: make build

  prepare-release:
    name: prepare release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: build
    permissions:
      contents: read
    outputs:
      version: ${{ steps.release.outputs.version || steps.prerelease.outputs.version }}
      prerelease: ${{ steps.prerelease.outputs.version != '' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0

      - name: Determine release version
        id: release
        if: github.ref == 'refs/heads/main'
        env:
          BEFORE_SHA: ${{ github.event.before }}
        shell: bash
        run: |
          set -euo pipefail

          CURRENT_VERSION=$(uv version --short)
          PREVIOUS_VERSION=$(
            git show "${BEFORE_SHA}:pyproject.toml" |
              sed -n '/^\[project\]/,/^\[/s/^version = "\([^"]*\)"/\1/p'
          )

          if [ "${CURRENT_VERSION}" != "${PREVIOUS_VERSION}" ]; then
            echo "version=${CURRENT_VERSION}" >> "${GITHUB_OUTPUT}"
          fi

      - name: Determine prerelease version
        id: prerelease
        if: >-
          github.event_name == 'pull_request' &&
          github.event.pull_request.user.login != 'dependabot[bot]' &&
          github.event.pull_request.head.repo.full_name == github.repository
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail

          CURRENT_VERSION=$(uv version --short)
          BASE_VERSION=$(
            git show "${BASE_SHA}:pyproject.toml" |
              sed -n '/^\[project\]/,/^\[/s/^version = "\([^"]*\)"/\1/p'
          )

          if [ "${CURRENT_VERSION}" != "${BASE_VERSION}" ]; then
            RELEASE_VERSION=${CURRENT_VERSION}
          else
            RELEASE_VERSION=$(uv version --bump patch --dry-run --short)
          fi

          VERSION="${RELEASE_VERSION}b${GITHUB_RUN_NUMBER}"

          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"

  package:
    name: package ${{ needs.prepare-release.outputs.version }}
    if: needs.prepare-release.outputs.version != ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: prepare-release
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0

      - name: Set package version
        if: needs.prepare-release.outputs.prerelease == 'true'
        env:
          VERSION: ${{ needs.prepare-release.outputs.version }}
        run: uv version "${VERSION}" --frozen

      - name: Link prerelease metadata to the pull request
        if: needs.prepare-release.outputs.prerelease == 'true'
        env:
          PULL_REQUEST_URL: ${{ github.event.pull_request.html_url }}
        run: sed -i "s#Repository = .*#Repository = \"${PULL_REQUEST_URL}\"#" pyproject.toml

      - name: Build distributions
        run: make build

      - name: Upload distributions
        uses: actions/upload-artifact@v7.0.1
        with:
          name: python-package-distributions
          path: dist/

  publish:
    name: publish ${{ needs.prepare-release.outputs.version }} to PyPI
    if: needs.prepare-release.outputs.version != ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs:
      - prepare-release
      - package
    permissions:
      contents: read

    steps:
      - name: Download distributions
        uses: actions/download-artifact@v8
        with:
          name: python-package-distributions
          path: dist/

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0

      - name: Publish distributions to PyPI
        run: uv publish dist/*
        env:
          UV_PUBLISH_TOKEN: ${{ secrets.PYPI_TOKEN }}

  comment-prerelease:
    name: comment with prerelease instructions
    if: needs.prepare-release.outputs.prerelease == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs:
      - prepare-release
      - publish
    permissions:
      issues: write
      pull-requests: write

    steps:
      - name: Comment on pull request
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.prepare-release.outputs.version }}
          PULL_REQUEST_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          gh pr comment "${PULL_REQUEST_NUMBER}" \
            --repo "${GITHUB_REPOSITORY}" \
            --edit-last \
            --create-if-none \
            --body "$(cat <<EOF
          This change was prereleased to PyPI. Try it out:

          \`\`\`bash
          python -m pip install openitinerary==${VERSION}
          \`\`\`

          https://pypi.org/project/openitinerary/${VERSION}/
          EOF
          )"

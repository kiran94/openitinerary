[project]
name = "openitinerary"
version = "0.1.3"
description = "OpenItinerary is an open, vendor-neutral standard for representing travel itineraries as structured data."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
    { name = "kiran94" }
]
requires-python = ">=3.11"
keywords = [ "itinerary", "open", "standard", "travel", "flight", "mcp" ]
classifiers = [
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Topic :: Utilities",
    "Topic :: Software Development",
    "Topic :: Software Development :: Version Control :: Git"
]
dependencies = [
    "pycountry>=26.2.16",
    "pydantic[email]>=2.13.4",
    "pydantic-extra-types>=2.11.1",
    "tzdata>=2026.3",
]


[project.optional-dependencies]
adapters = [
    "beautifulsoup4>=4.15.0",
    "fastapi[standard]>=0.141.1",
    "pydantic-ai>=2.22.0",
    "pydantic-ai-slim[duckduckgo]>=2.22.0",
    "pypdf>=6.14.2",
    "opentelemetry-api>=1.44.0",
    "opentelemetry-sdk>=1.44.0",
    "opentelemetry-exporter-otlp>=1.44.0",
    "opentelemetry-instrumentation-fastapi>=0.65b0",
    "opentelemetry-instrumentation-httpx>=0.65b0",
    "opentelemetry-instrumentation-requests>=0.65b0",
    "opentelemetry-instrumentation-grpc>=0.65b0",
    "opentelemetry-instrumentation-logging>=0.65b0",
]

[project.scripts]
openitinerary = "openitinerary:main"

[project.urls]
Homepage = "https://pypi.org/project/openitinerary/"
Repository = "https://github.com/kiran94/openitinerary"
Documentation = "https://github.com/kiran94/openitinerary/blob/main/README.md"

[build-system]
requires = ["uv_build>=0.11.8,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "ruff>=0.15.20",
]

[tool.ruff]
line-length = 120

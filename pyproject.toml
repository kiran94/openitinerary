[project]
name = "open-itinerary"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "kiran94", email = "" }
]
requires-python = ">=3.11"
dependencies = [
    "pycountry>=26.2.16",
    "pydantic[email]>=2.13.4",
    "pydantic-extra-types>=2.11.1",
    "tzdata>=2026.3",
]

[project.optional-dependencies]
adapters = [
    "beautifulsoup4>=4.15.0",
    "pydantic-ai>=2.22.0",
    "pydantic-ai-slim[duckduckgo]>=2.22.0",
    "pypdf>=6.14.2",
]

[project.scripts]
open-itinerary = "open_itinerary:main"

[build-system]
requires = ["uv_build>=0.11.8,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "ruff>=0.15.20",
]

[tool.ruff]
line-length = 120
